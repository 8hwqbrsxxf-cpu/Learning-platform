services:
  certcoach:
    build: .
    image: certcoach:latest
    container_name: certcoach
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env # copy .env.example to .env first
    volumes:
      - certcoach-data:/data # SQLite progress database; survives rebuilds and updates

volumes:
  certcoach-data:
